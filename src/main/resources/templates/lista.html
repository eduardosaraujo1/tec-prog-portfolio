<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<title>Lista de Produtos</title>
</head>
<body>
	<main class="container py-5">
		<h1 class="mb-4">Lista de Produtos</h1>
		<div class="card">
			<div class="card-body">
				<div class="alert alert-info" role="alert" th:if="${#lists.isEmpty(produtos)}">
					Nenhum produto cadastrado ainda.
				</div>
				<div class="table-responsive" th:unless="${#lists.isEmpty(produtos)}">
					<table class="table table-striped">
						<thead class="table-dark">
							<tr>
								<th scope="col">#</th>
								<th scope="col">Nome</th>
								<th scope="col">Preço</th>
								<th scope="col">Categoria</th>
								<th scope="col">Estoque</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="produto, iterStat : ${produtos}">
								<td th:text="${iterStat.count}">1</td>
								<td th:text="${produto.nome}">Nome</td>
								<td th:text="'R$ ' + ${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
								<td th:text="${produto.categoria}">Categoria</td>
								<td th:text="${produto.estoque}">Estoque</td>
							</tr>
						</tbody>
					</table>
				</div>
				<p class="text-body-secondary" th:unless="${#lists.isEmpty(produtos)}"
				   th:text="${produtos.size()} + ' produto(s) cadastrado(s)'"></p>
				<a th:href="@{/cadastrar}" class="btn btn-primary">+ Cadastrar novo produto</a>
			</div>
		</div>
	</main>
</body>
</html>
