<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<title>Cadastrar Produto</title>
</head>
<body>
	<main class="container py-5">
		<h1 class="mb-4">Cadastrar Produto</h1>
		<form th:action="@{/cadastrar}" th:object="${produto}" method="post">
			<div class="mb-3">
				<label class="form-label" for="nome">Nome</label>
				<input class="form-control" type="text" th:field="*{nome}"
					   placeholder="Ex: Camiseta, Notebook..." required>
			</div>
			<div class="mb-3">
				<label class="form-label" for="preco">Preço (R$)</label>
				<input class="form-control" type="number" th:field="*{preco}"
					   step="0.01" min="0" placeholder="Ex: 49.90" required>
			</div>
			<div class="mb-3">
				<label class="form-label" for="categoria">Categoria</label>
				<input class="form-control" type="text" th:field="*{categoria}"
					   placeholder="Ex: Eletrônico, Vestuário..." required>
			</div>
			<div class="mb-3">
				<label class="form-label" for="categoria">Estoque</label>
				<input class="form-control" type="number" th:field="*{estoque}"
					   placeholder="0" value="1" min="1" required>
			</div>
			<button class="btn btn-primary" type="submit">Cadastrar</button>
		</form>
		<a th:href="@{/lista}" class="btn btn-secondary mt-3">Ver lista de produtos</a>
	</main>
</body>
</html>
